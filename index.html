<!DOCTYPE html>
<html lang="en-US" class="no-select">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#608860">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <link rel="stylesheet" href="css/style.css">
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" href="icon-512.png" />
    </head>

    <body>
        <nav>
            <button class="nav-button" onclick="navigate('home')">Home</button>
            <button class="nav-button" onclick="navigate('symptoms')">Symptoms</button>
            <button class="nav-button" onclick="navigate('history')">History</button>
        </nav>

        <main id="app"></main>


        <script type="module" src="js/app.js"></script>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js")
                    .then(registration => {
                        console.log("Service worker registered");

                        registration.update();

                        navigator.serviceWorker.addEventListener(
                            "message",
                            event => {
                                if(event.data?.type === "UPDATED") {
                                    window.location.reload();
                                }
                            }
                        )
                    })
                    .catch(err => {
                        console.error("Service worker registration failed: ", err);
                    });
            } else {
                console.error("Service workers are not supported.");
            }
        </script>
    </body>
</html>
