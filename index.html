<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#608860">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <link rel="stylesheet" href="css/style.css">
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" href="icon-512.png" />
    </head>

    <body>
        <nav>
            <button class="nav-button" onclick="navigate('home')">Home</button>
            <button class="nav-button" onclick="navigate('symptoms')">Symptoms</button>
            <button class="nav-button" onclick="navigate('history')">History</button>
        </nav>

        <main id="app"></main>


        <script type="module" src="js/app.js"></script>
        <script>
            // Does "serviceWorker" exist
            if ("serviceWorker" in navigator) {
                // If yes, we register the service worker
                navigator.serviceWorker.register("/sw.js").then(
                    (registration) => {
                        console.log("Service worker registration successful: ", registration);
                    },
                    (error) => {
                        console.error(`Service worker registration failed: ${error}`);
                    },
                );
            } else {
                console.error("Service workers are not supported.");
            }
        </script>
    </body>
</html>
